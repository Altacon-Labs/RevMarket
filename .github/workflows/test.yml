name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js (>=22.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test

      - name: Check icons
        run: npm run check:icons

      - name: Build frontend
        run: npm run build

      - name: Install pinned Playwright runner
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser fixture scenarios
        run: npm run test:browser
        env:
          CI: "true"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust target
        run: |
          rustup target add wasm32v1-none || (rustup update stable && rustup target add wasm32v1-none)

      - name: Run Rust workspace tests
        run: cargo test --locked --lib --manifest-path contracts/Cargo.toml

      - name: Build contracts WASM
        run: cargo build --locked --release --target wasm32v1-none --manifest-path contracts/Cargo.toml
