# Testnet staging recipe with strict API/worker process and credential separation,
# persistent SQLite and settlement evidence volumes, host readiness probe, and graceful shutdown.
# Production hosting and Mainnet activation are intentionally excluded.
services:
  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "--experimental-sqlite", "backend/server.mjs"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    environment:
      BACKEND_ENV: staging
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "3001"
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      BACKEND_DB: /var/lib/revmarket/db/revmarket.sqlite
      BACKEND_SHUTDOWN_TIMEOUT_MS: ${BACKEND_SHUTDOWN_TIMEOUT_MS:-5000}
      # CONTRACT_ID and network are required so /api/activity/verified resolves the
      # correct contract and reports indexer freshness; RESOLVER_SECRET is intentionally
      # absent from this service.
      CONTRACT_ID: ${CONTRACT_ID:?CONTRACT_ID is required}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      INDEXER_STALE_AFTER_SECONDS: ${INDEXER_STALE_AFTER_SECONDS:-120}
      SUPER_ADMIN_WALLETS: ${SUPER_ADMIN_WALLETS:-}
      PINATA_JWT: ${PINATA_JWT:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ../../:/app:ro
      - revmarket_staging_db:/var/lib/revmarket/db
      - revmarket_staging_backups:/var/lib/revmarket/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STAGING_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ingestor:
    image: node:22-bookworm-slim
    working_dir: /app
    # ingest.mjs performs a bounded sync (INGEST_MAX_PAGES) and exits, so wrap it in
    # a sleep loop to make the indexer recurrent. Gap/unavailable statuses exit
    # non-zero and are retried on the next pass; gaps and RPC outages are persisted
    # to ingestion_gaps / the checkpoint status so they surface via the API.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          node --experimental-sqlite backend/ingest.mjs || true
          sleep "$${INGEST_INTERVAL_SECONDS:-15}"
        done
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    environment:
      # Uses the same contract identity and network as the API; no signing key.
      CONTRACT_ID: ${CONTRACT_ID:?CONTRACT_ID is required}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      BACKEND_DB: /var/lib/revmarket/db/revmarket.sqlite
      START_LEDGER: ${START_LEDGER:-}
      INGEST_PAGE_LIMIT: ${INGEST_PAGE_LIMIT:-100}
      INGEST_MAX_PAGES: ${INGEST_MAX_PAGES:-25}
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-15}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../../:/app:ro
      - revmarket_staging_db:/var/lib/revmarket/db

  worker:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "--experimental-sqlite", "service/worker.mjs"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 15s
    environment:
      CONTRACT_ID: ${CONTRACT_ID:?CONTRACT_ID is required}
      RESOLVER_SECRET: ${RESOLVER_SECRET:?RESOLVER_SECRET is required}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      EVENT_SOURCE_URLS: ${EVENT_SOURCE_URLS:-[]}
      RUN_ONCE: ${RUN_ONCE:-0}
      # Persist the attempts database on the dedicated state volume so that
      # recreating the container does not lose retry history and evidence.
      # The default path (./service/attempts.sqlite) falls under the read-only
      # /app mount and would cause a write-permission error on startup.
      ATTEMPTS_DB_PATH: /var/lib/revmarket/worker/attempts.sqlite
      EVIDENCE_DIR: /var/lib/revmarket/evidence
    volumes:
      - ../../:/app:ro
      - revmarket_staging_evidence:/var/lib/revmarket/evidence
      - revmarket_staging_worker_state:/var/lib/revmarket/worker

volumes:
  revmarket_staging_db:
  revmarket_staging_backups:
  revmarket_staging_evidence:
  revmarket_staging_worker_state:
